name: Gnesyuk MAX Longread Agent

on:
  schedule:
    # 15:00 UTC = 18:00 МСК — вечерний лонгрид
    - cron: "0 15 * * *"
  workflow_dispatch:   # ручной запуск

permissions:
  contents: write

concurrency:
  group: max-agent
  cancel-in-progress: false

jobs:
  max-longread:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Оформить репо
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install requests openai Pillow

      - name: Запустите max-agent
        env:
          GIGACHAT_CLIENT_ID1: ${{ secrets.GIGACHAT_CLIENT_ID1 }}
          GIGACHAT_CLIENT_SECRET1: ${{ secrets.GIGACHAT_CLIENT_SECRET1 }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
        run: python max-agent.py

      - name: Зафиксировать кэш и историю MAX
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          for f in max_failed.json max_used.json max_history.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "✅ Коммитить нечего"
            exit 0
          fi
          git commit -m "chore: max agent cache [skip ci]"
          git push
          echo "✅ Кэш MAX закоммичен"
