name: VK Post Agent

on:
  schedule:
    - cron: "0 8 * * *"        # ежедневно в 08:00 UTC
  workflow_dispatch:            # ручной запуск

permissions:
  contents: write               # нужно для коммита картинок и push

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests Pillow

      - name: Run VK agent
        run: python agent.py
        env:
          # --- ВКонтакте (v16: юзер-токен для загрузки фото, групповой для поста) ---
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_ALBUM_ID: ${{ secrets.VK_ALBUM_ID }}
          # --- ИИ-ступени текстов ---
          GIGACHAT_CLIENT_ID1: ${{ secrets.GIGACHAT_CLIENT_ID1 }}
          GIGACHAT_CLIENT_SECRET1: ${{ secrets.GIGACHAT_CLIENT_SECRET1 }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_KEY2: ${{ secrets.OPENROUTER_KEY2 }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          # --- Картинки ---
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

      - name: Commit images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/ vk_album.json 2>/dev/null || true
          if ! git diff --quiet --cached; then
            git commit -m "chore: vk images [skip ci]"
            git pull --rebase || true
            git push || echo "⚠️ push не удался — картинку закоммитим в следующий раз"
          else
            echo "ℹ️ Нет изменений для коммита"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
