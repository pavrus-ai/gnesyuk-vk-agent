name: VK Post Agent

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vkpost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests Pillow

      - name: Run VK agent
        run: python agent.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GROQ_KEY_TEASER: ${{ secrets.GROQ_KEY_TEASER }}
          OPENROUTER_KEY_TEASER: ${{ secrets.OPENROUTER_KEY_TEASER }}

      - name: Commit images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: vk images [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
