name: Music Agent

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run music agent
        run: python music_agent.py
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_GROUP_ID }}

      - name: Commit published_albums.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_albums.json || true
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "chore: update published albums"
            git push
          fi
