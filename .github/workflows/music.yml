name: Music Agent

on:
  schedule:
    # ВАЖНО: эта строка должна ТОЧНО совпадать с PUBLISH_CRON в music_agent.py ("30 6 * * *")
    - cron: "30 6 * * *"          # 09:30 МСК — режим ПУБЛИКАЦИЯ
    # ТИКИ для допубликации pending_music.json.
    # Оставьте ВАШИ текущие строки тиков, если они отличаются:
    - cron: "0 9,12,15,18,21 * * *"
  workflow_dispatch:               # ручной запуск (работает как публикация)

permissions:
  contents: write                  # нужно для коммита state-файлов

concurrency:
  group: music-agent
  cancel-in-progress: false        # два запуска не должны идти одновременно

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Оформить репо
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install requests Pillow

      - name: Запустите music-agent
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          SCHEDULE: ${{ github.event.schedule }}   # агент по этой строке отличает публикацию от тика
        run: python music_agent.py

      - name: Зафиксировать state-файлы (кэш, pending, журнал)
        if: always()                                 # выполняется даже при сбое публикации
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add covers_cache.json pending_music.json track_journal.json || true
          if git diff --cached --quiet; then
            echo "✅ State-файлы не изменились"
          else
            git commit -m "chore: music agent state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
            echo "✅ State-файлы закоммичены (включая журнал треков)"
          fi
