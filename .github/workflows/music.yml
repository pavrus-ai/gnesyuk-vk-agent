name: Publish music to VK

on:
  schedule:
    - cron: "30 6 * * *"       # 09:30 МСК — публикация музыки (через 3.5 часа после книг в 06:00)
    - cron: "0 9,15 * * *"     # ТИКИ: 12:00 и 18:00 МСК — допубликация pending
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run music agent
        env:
          SCHEDULE: ${{ github.event.schedule }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python music_agent.py

      - name: Commit covers cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in covers_cache.json pending_music.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if [ -d covers ]; then git add covers/; fi
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: music caches [skip ci]"
            git push
          else
            echo "Коммитить нечего"
          fi
